<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b0d">
<title>StatPulse is offline</title>
<style>
  html,body{height:100%;margin:0;background:#050b0d;color:#f3f7f6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}
  img{width:72px;height:auto;margin-bottom:24px}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0 0 24px;max-width:320px;line-height:1.55;color:rgba(255,255,255,.6);font-size:15px}
  button{background:#18e6a4;color:#03100c;border:0;border-radius:12px;padding:12px 24px;font-size:15px;font-weight:700}
</style>
</head>
<body>
<main>
  <img src="/images/logo/logo-mark.png" alt="StatPulse">
  <h1>You are offline</h1>
  <p>StatPulse needs a connection for live scores and predictions. Reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
